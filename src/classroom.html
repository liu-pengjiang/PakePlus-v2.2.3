function generateRandomRectangle(gridRows, gridCols, maxSize) {
    const cap = maxSize || 6;
    const maxW = Math.min(gridCols, cap);
    const maxH = Math.min(gridRows, cap);
    const sizes = [];
    // 只生成长方形（宽≠高），不生成正方形
    for (let h = 2; h <= maxH; h++) {
        for (let w = 2; w <= maxW; w++) {
            // 格子数是4的倍数，且宽和高不相等（排除正方形）
            if ((w * h) % 4 === 0 && w !== h) {
                sizes.push({width: w, height: h});
            }
        }
    }
    if (sizes.length === 0) return null;
    const dim = sizes[Math.floor(Math.random() * sizes.length)];
    const maxRow = gridRows - dim.height;
    const maxCol = gridCols - dim.width;
    const sr = Math.floor(Math.random() * (maxRow + 1));
    const sc = Math.floor(Math.random() * (maxCol + 1));
    const cells = [];
    for (let r = 0; r < dim.height; r++) {
        for (let c = 0; c < dim.width; c++) {
            cells.push({row: sr + r, col: sc + c});
        }
    }
    return { type:'rectangle', startRow:sr, startCol:sc, width:dim.width, height:dim.height, cells };
}

function generateRandomSquare(gridRows, gridCols, maxSize) {
    const cap = maxSize || 6;
    const upper = Math.min(gridRows, gridCols, cap);
    const sizes = [];
    for (let s = 2; s <= upper; s += 2) {
        if ((s * s) % 4 === 0) sizes.push(s);
    }
    const size = sizes[Math.floor(Math.random() * sizes.length)];
    const maxRow = gridRows - size;
    const maxCol = gridCols - size;
    const sr = Math.floor(Math.random() * (maxRow + 1));
    const sc = Math.floor(Math.random() * (maxCol + 1));
    const cells = [];
    for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
            cells.push({row: sr + r, col: sc + c});
        }
    }
    return { type:'square', startRow:sr, startCol:sc, size, cells };
}

function generateRandomTetrominosInTarget(targetCells, count) {
    const types = ['I','L','T','Z','O'];
    const placed = [];
    let attempts = 0;
    while (placed.length < count && attempts < 500) {
        attempts++;
        const type = types[Math.floor(Math.random() * types.length)];
        const rotation = [0,90,180,270][Math.floor(Math.random()*4)];
        const flips = [null,'horizontal','vertical'];
        const flip = flips[Math.floor(Math.random()*flips.length)];
        const cellsRel = getCellsFromTransform(type, rotation, flip);
        const anchorIdx = Math.floor(Math.random() * targetCells.length);
        const anchor = targetCells[anchorIdx];
        const absCells = cellsRel.map(([r,c]) => ({row:anchor.row + r, col:anchor.col + c}));
        const allInTarget = absCells.every(ac =>
            targetCells.some(tc => tc.row===ac.row && tc.col===ac.col)
        );
        const noOverlap = !absCells.some(ac =>
            placed.some(p => p.cells.some(pc => pc.row===ac.row && pc.col===ac.col))
        );
        if (allInTarget && noOverlap) {
            placed.push({ type, cells: absCells });
        }
    }
    return placed;
}

// 检查空白区域是否能被至少一个四连方填充（核心形状检测）
// 返回：true = 能放下至少一个四连方，false = 放不下任何四连方
function checkBlankAreaCanFitTetromino(blankCells) {
    if (blankCells.length < 4) return false;
    
    // 定义四连方基本形状的单元格偏移（以重心为参考）
    const SHAPE_TYPES = ['I','L','T','Z','O'];
    
    // 基础形状单元格的4连通邻居偏移
    const neighbors4 = [[0,1],[0,-1],[1,0],[-1,0]];
    
    // 获取形状的边界框尺寸
    function getShapeBounds(cells) {
        const rows = cells.map(c => c[0]);
        const cols = cells.map(c => c[1]);
        const minR = Math.min(...rows), maxR = Math.max(...rows);
        const minC = Math.min(...cols), maxC = Math.max(...cols);
        return { width: maxC - minC + 1, height: maxR - minR + 1, minR, maxR, minC, maxC };
    }
    
    // 翻转形状
    function flipShape(cells, cols, rows, flip) {
        return cells.map(([r, c]) => {
            if (flip === 'horizontal') return [r, cols - 1 - c];
            if (flip === 'vertical') return [rows - 1 - r, c];
            return [r, c];
        });
    }
    
    // 旋转形状
    function rotateShape(cells, cols, rows, angle) {
        return cells.map(([r, c]) => {
            if (angle === 90) return [c, rows - 1 - r];
            if (angle === 180) return [rows - 1 - r, cols - 1 - c];
            if (angle === 270) return [cols - 1 - c, r];
            return [r, c];
        });
    }
    
    // 规范化形状（移动到左上角）
    function normalizeShape(cells) {
        const minR = Math.min(...cells.map(c => c[0]));
        const minC = Math.min(...cells.map(c => c[1]));
        return cells.map(([r, c]) => [r - minR, c - minC]);
    }
    
    // 创建Set用于快速查找
    const blankSet = new Set(blankCells.map(c => c.row + ',' + c.col));
    
    // 检查某形状能否放在空白区域的某个位置
    function canPlaceShape(shapeCells, anchorRow, anchorCol) {
        for (const [dr, dc] of shapeCells) {
            const r = anchorRow + dr;
            const c = anchorCol + dc;
            if (!blankSet.has(r + ',' + c)) return false;
        }
        return true;
    }
    
    // 尝试放置任意形状到空白区域的每个可能位置
    for (const type of SHAPE_TYPES) {
        let cells = BASE_SHAPES[type].slice();
        const bounds = getShapeBounds(cells);
        
        // 生成所有变换变体
        const variants = [];
        
        // 原始方向
        let normalized = normalizeShape(cells);
        variants.push(normalized);
        
        // 水平和垂直翻转
        const flippedH = flipShape(cells, bounds.width, bounds.height, 'horizontal');
        variants.push(normalizeShape(flippedH));
        const flippedV = flipShape(cells, bounds.width, bounds.height, 'vertical');
        variants.push(normalizeShape(flippedV));
        
        // 旋转90度及其翻转
        const rotated90 = rotateShape(cells, bounds.width, bounds.height, 90);
        let rh = getShapeBounds(rotated90);
        variants.push(normalizeShape(rotated90));
        variants.push(normalizeShape(flipShape(rotated90, rh.width, rh.height, 'horizontal')));
        variants.push(normalizeShape(flipShape(rotated90, rh.width, rh.height, 'vertical')));
        
        // 旋转180度
        const rotated180 = rotateShape(cells, bounds.width, bounds.height, 180);
        variants.push(normalizeShape(rotated180));
        
        // 旋转270度及其翻转
        const rotated270 = rotateShape(cells, bounds.width, bounds.height, 270);
        const r270h = getShapeBounds(rotated270);
        variants.push(normalizeShape(rotated270));
        variants.push(normalizeShape(flipShape(rotated270, r270h.width, r270h.height, 'horizontal')));
        variants.push(normalizeShape(flipShape(rotated270, r270h.width, r270h.height, 'vertical')));
        
        // 去重
        const uniqueVariants = [];
        const seen = new Set();
        for (const v of variants) {
            const key = v.map(([r,c]) => r+','+c).sort().join('|');
            if (!seen.has(key)) {
                seen.add(key);
                uniqueVariants.push(v);
            }
        }
        
        // 尝试每个变体、每个位置
        for (const variant of uniqueVariants) {
            const varBounds = getShapeBounds(variant);
            
            // 遍历空白区域的每个格子作为可能的放置起点
            for (const blankCell of blankCells) {
                // 尝试形状的每个单元格作为锚点
                for (const [dr, dc] of variant) {
                    const anchorR = blankCell.row - dr;
                    const anchorC = blankCell.col - dc;
                    
                    // 检查形状是否完全在空白区域内
                    if (canPlaceShape(variant, anchorR, anchorC)) {
                        return true; // 找到了能放置的位置
                    }
                }
            }
        }
    }
    
    return false; // 所有形状都无法放置
}

// 生成已连接的四连方群（应用实践-随机填充图形专用）
// 策略：
// 1. 生成一个矩形/正方形（行数≤6，列数≤6，格子数为4的倍数）
// 2. 在矩形边缘放置2-3个连接的四连方
// 3. 空白区域在内部，连通且不分割
// 返回：{ clusterCells, preFilled, minR, maxR, minC, maxC }
function generateConnectedTetrominoCluster(gridRows, gridCols) {
    const types = ['I','L','T','Z','O'];

    // 预填充四连方数量
    const tetroCount = 2 + Math.floor(Math.random() * 2); // 2~3个

    // 生成有效尺寸（只生成指定的尺寸组合，格子数为4的倍数，且行数≤6、列数≤6）
    function getValidSizes() {
        // 指定的有效尺寸组合（行数≤6，列数≤6，且格子数为4的倍数）
        const validCombos = [
            { width: 2, height: 4 },
            { width: 4, height: 2 },
            { width: 2, height: 6 },
            { width: 6, height: 2 },
            { width: 3, height: 4 },
            { width: 4, height: 3 },
            { width: 3, height: 6 },
            { width: 6, height: 3 },
            { width: 4, height: 4 },
            { width: 4, height: 6 },
            { width: 6, height: 4 },
            { width: 6, height: 6 }
        ];
        return validCombos;
    }

    // 主生成循环
    for (let attempt = 0; attempt < 100; attempt++) {
        const sizes = getValidSizes();
        if (sizes.length === 0) continue;

        const size = sizes[Math.floor(Math.random() * sizes.length)];
        const { width, height } = size;

        // 在网格中央附近定位矩形
        const maxRow = gridRows - height;
        const maxCol = gridCols - width;
        const startR = Math.floor(Math.random() * (maxRow + 1));
        const startC = Math.floor(Math.random() * (maxCol + 1));

        // 矩形范围
        const rectMinR = startR;
        const rectMaxR = startR + height - 1;
        const rectMinC = startC;
        const rectMaxC = startC + width - 1;

        // 收集边缘位置（矩形边框上的格子）
        const edgeCells = [];
        for (let r = rectMinR; r <= rectMaxR; r++) {
            edgeCells.push({ row: r, col: rectMinC });
            edgeCells.push({ row: r, col: rectMaxC });
        }
        for (let c = rectMinC + 1; c < rectMaxC; c++) {
            edgeCells.push({ row: rectMinR, col: c });
            edgeCells.push({ row: rectMaxR, col: c });
        }

        // 打乱边缘位置
        for (let i = edgeCells.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [edgeCells[i], edgeCells[j]] = [edgeCells[j], edgeCells[i]];
        }

        // 生成预填充四连方（从边缘开始，互相连接）
        const preFilled = [];
        const usedCells = new Set();
        const addCell = (r, c) => usedCells.add(r + ',' + c);
        const hasCell = (r, c) => usedCells.has(r + ',' + c);

        let placed = 0;
        let placeAttempts = 0;

        while (placed < tetroCount && placeAttempts < 200) {
            placeAttempts++;
            const type = types[Math.floor(Math.random() * types.length)];
            const rotation = [0, 90, 180, 270][Math.floor(Math.random() * 4)];
            const flip = [null, 'horizontal', 'vertical'][Math.floor(Math.random() * 3)];

            // 获取形状相对坐标
            let cells = BASE_SHAPES[type].map(([r, c]) => ({ r, c }));
            let cols = Math.max(...cells.map(c => c.c)) + 1;
            let rows = Math.max(...cells.map(c => c.r)) + 1;
            if (flip) {
                cells = cells.map(({ r, c }) => flipPoint(r, c, cols, rows, flip));
                cols = Math.max(...cells.map(c => c.c)) + 1;
                rows = Math.max(...cells.map(c => c.r)) + 1;
            }
            if (rotation !== 0) {
                cells = cells.map(({ r, c }) => rotatePoint(r, c, cols, rows, rotation));
            }
            const minR = Math.min(...cells.map(c => c.r));
            const minC = Math.min(...cells.map(c => c.c));
            const normalized = cells.map(({ r, c }) => [r - minR, c - minC]);

            // 候选位置
            const candidates = [];

            if (placed === 0) {
                // 第一个：从边缘格子中选择
                for (const ec of edgeCells.slice(0, 20)) {
                    for (const [dr, dc] of normalized) {
                        candidates.push({ anchorR: ec.row - dr, anchorC: ec.col - dc });
                    }
                }
            } else {
                // 后续：与已放置的四连方相邻
                usedCells.forEach(key => {
                    const [r, c] = key.split(',').map(Number);
                    [[0, 1], [0, -1], [1, 0], [-1, 0]].forEach(([dr, dc]) => {
                        for (const [ndr, ndc] of normalized) {
                            candidates.push({ anchorR: r + dr - ndr, anchorC: c + dc - ndc });
                        }
                    });
                });
            }

            // 打乱候选
            for (let i = candidates.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
            }

            // 尝试放置
            let success = false;
            for (const { anchorR, anchorC } of candidates) {
                const absCells = normalized.map(([dr, dc]) => ({
                    row: anchorR + dr,
                    col: anchorC + dc
                }));

                // 检查是否在矩形内
                const inRect = absCells.every(c =>
                    c.row >= rectMinR && c.row <= rectMaxR &&
                    c.col >= rectMinC && c.col <= rectMaxC
                );
                if (!inRect) continue;

                // 检查是否重叠
                const overlaps = absCells.some(c => hasCell(c.row, c.col));
                if (overlaps) continue;

                // 第一个需要与边缘接触
                if (placed === 0) {
                    const touchesEdge = absCells.some(c =>
                        c.row === rectMinR || c.row === rectMaxR ||
                        c.col === rectMinC || c.col === rectMaxC
                    );
                    if (!touchesEdge) continue;
                }

                // 放置
                preFilled.push({ type, cells: absCells });
                absCells.forEach(c => addCell(c.row, c.col));
                placed++;
                success = true;
                break;
            }
        }

        if (preFilled.length < tetroCount) continue;

        // 验证预填充四连方连通性
        const allPreCells = preFilled.flatMap(p => p.cells);
        const cellSet = new Set(allPreCells.map(c => c.row + ',' + c.col));
        const visited = new Set();
        const queue = [allPreCells[0]];
        visited.add(allPreCells[0].row + ',' + allPreCells[0].col);

        while (queue.length > 0) {
            const cur = queue.shift();
            [[0, 1], [0, -1], [1, 0], [-1, 0]].forEach(([dr, dc]) => {
                const nb = { row: cur.row + dr, col: cur.col + dc };
                const key = nb.row + ',' + nb.col;
                if (cellSet.has(key) && !visited.has(key)) {
                    visited.add(key);
                    queue.push(nb);
                }
            });
        }

        if (visited.size !== allPreCells.length) continue;

        // 计算空白格子（矩形内除了预填充以外的格子）
        // 重要：必须有空白区域，且空白区域至少有4格（能放下一个四连方）
        const preFilledSet = new Set(allPreCells.map(c => c.row + ',' + c.col));
        const blankCells = [];

        for (let r = rectMinR; r <= rectMaxR; r++) {
            for (let c = rectMinC; c <= rectMaxC; c++) {
                if (!preFilledSet.has(r + ',' + c)) {
                    blankCells.push({ row: r, col: c });
                }
            }
        }

        // 必须有空白区域，且至少有4格
        if (blankCells.length < 4) continue;

        // 关键检查：空白区域必须能被至少一个四连方填满
        const canFitTetromino = checkBlankAreaCanFitTetromino(blankCells);
        if (!canFitTetromino) continue;

        // 验证空白区域连通性
        const blankSet = new Set(blankCells.map(c => c.row + ',' + c.col));
        const blankVisited = new Set();
        const blankQueue = [blankCells[0]];
        blankVisited.add(blankCells[0].row + ',' + blankCells[0].col);

        while (blankQueue.length > 0) {
            const cur = blankQueue.shift();
            [[0, 1], [0, -1], [1, 0], [-1, 0]].forEach(([dr, dc]) => {
                const nb = { row: cur.row + dr, col: cur.col + dc };
                const key = nb.row + ',' + nb.col;
                if (blankSet.has(key) && !blankVisited.has(key)) {
                    blankVisited.add(key);
                    blankQueue.push(nb);
                }
            });
        }

        // 空白区域必须连通
        if (blankVisited.size !== blankCells.length) continue;
        
        // 验证总格子数是4的倍数
        const totalCells = blankCells.length + allPreCells.length;
        if (totalCells % 4 !== 0) continue;

        // 成功！返回结果
        return {
            clusterCells: [...blankCells, ...allPreCells],
            preFilled: preFilled,
            minR: rectMinR,
            maxR: rectMaxR,
            minC: rectMinC,
            maxC: rectMaxC,
            blankCells: blankCells
        };
    }

    return null;
}

        if (cell) {
            cell.classList.add('target-cell');
            if (preFilledSet.has(row + ',' + col)) {
                cell.classList.add('pre-filled');
            }
        }
    });
}

function clearTargetHighlight() {
    document.querySelectorAll('.target-cell').forEach(c => {
        c.classList.remove('target-cell','pre-filled');
    });
}

function validatePracticeFill() {
    const target = window.__practiceTarget;
    if (!target) return;
    const allFilled = (target.cells||[]).every(({row,col}) => {
        const cell = document.querySelector('.grid-cell[data-row="' + row + '"][data-col="' + col + '"]');
        return cell && cell.hasChildNodes();
    });
    if (allFilled) {
        showTetrominoMessage('🎉 恭喜！你成功将四连方围成了一个完整图形！');
    }
}

function renderPracticeMode(cfg, skipGenerate) {
    window.__practiceTarget = null;
    clearTargetHighlight();
    selectedShape = null;
    document.getElementById('panelHeader').classList.remove('hidden');
    const sec = document.getElementById('tetrominoSection');
    sec.classList.remove('hidden');
    document.getElementById('dragSquaresSection').classList.add('hidden');
    document.getElementById('exerciseSection').classList.add('hidden');
    document.getElementById('summarySection').classList.add('hidden');

    const gridClass = cfg.gridClass || 'grid-14x8';
    const m = gridClass.match(/grid-(\d+)x(\d+)/);
    const gCols = m ? parseInt(m[1]) : 14;
    const gRows = m ? parseInt(m[2]) : 8;

    let target, descText;

    if (cfg.practiceType === 'rectangle') {
        if (skipGenerate) {
            // 首次进入：只初始化界面，不生成高亮，等用户点"随机长方形"
            descText = '点击右侧【🎲 随机长方形】生成一个随机长方形，然后在高亮区域放置四连方将其拼满。';
        } else {
            target = generateRandomRectangle(gRows, gCols);
            descText = '点击右侧【🎲 随机长方形】生成一个随机长方形，然后在高亮区域放置四连方将其拼满。';
        }
    } else if (cfg.practiceType === 'square') {
        if (skipGenerate) {
            // 首次进入：只初始化界面，不生成高亮，等用户点"随机正方形"
            descText = '点击右侧【🎲 随机正方形】生成一个随机正方形，然后在高亮区域放置四连方将其拼满。';
        } else {
            target = generateRandomSquare(gRows, gCols);
            descText = '点击右侧【🎲 随机正方形】生成一个随机正方形，然后在高亮区域放置四连方将其拼满。';
        }
    } else if (cfg.practiceType === 'fill') {
        if (skipGenerate) {
            descText = '点击右侧【🎲 随机填充图形】，请在剩余空格继续放置四连方，将这些已连接的四连方围成一个完整的长方形或正方形。';
        } else {
            // 循环生成直到得到有效图形（空白格为4的倍数且连通，空白区域连通）
            let attempts = 0;
            do {
                target = generateConnectedTetrominoCluster(gRows, gCols);
                attempts++;
            } while (!target && attempts < 100);
            // 如果生成失败，再尝试最多100次
            if (!target) {
                for (let i = 0; i < 100 && !target; i++) {
                    target = generateConnectedTetrominoCluster(gRows, gCols);
                }
            }
            descText = '请在剩余空格继续放置四连方，将这些已连接的四连方围成一个完整的长方形或正方形。';
            // 高亮区域：预填充四连方的外包围框，但只保留空白格子（不含预填充格）
            if (target) {
                const { minR, maxR, minC, maxC } = target;
                const preFilledPosSet = new Set((target.preFilled||[]).flatMap(pf =>
                    (pf.cells||[]).map(({row,col}) => row+','+col)
                ));
                target.cells = [];
                for (let r = minR; r <= maxR; r++) {
                    for (let c = minC; c <= maxC; c++) {
                        if (!preFilledPosSet.has(r+','+c)) {
                            target.cells.push({row: r, col: c});
                        }
                    }
                }
            }
        }
    }

    window.__practiceTarget = target || null;
    window.__practiceCfg = cfg;
    // 拼任意长方形/正方形/填充图形模式标题固定显示"操作提示"
    const displayTitle = (cfg.practiceType === 'rectangle' || cfg.practiceType === 'square' || cfg.practiceType === 'fill') ? '操作提示' : cfg.title;
    document.getElementById('panelTitle').textContent = displayTitle;
    document.getElementById('panelDesc').textContent = descText;

    // 根据模式分别显示对应按钮
    const btnRegen = document.getElementById('btnRegenRect');
    if (btnRegen) btnRegen.style.display = (cfg.practiceType === 'rectangle') ? '' : 'none';
    const btnSquare = document.getElementById('btnRegenSquare');
    if (btnSquare) btnSquare.style.display = (cfg.practiceType === 'square') ? '' : 'none';
    const btnFill = document.getElementById('btnRegenFill');
    if (btnFill) btnFill.style.display = (cfg.practiceType === 'fill') ? '' : 'none';

    buildShapePool(cfg.shapes || ['I','L','T','Z','O']);

    // 用 requestAnimationFrame 确保容器尺寸已渲染，再计算格子大小
    requestAnimationFrame(() => {
        buildGrid(gridClass);

        // skipGenerate=true 时（首次进入长方形/正方形/填充图形），不高亮，等用户点按钮
        if (!target) return;

        if (cfg.practiceType === 'fill') {
            // 填充图形模式：只高亮空白格子，预填充四连方正常颜色显示（不加 target-cell 高亮）
            const preFilledSet = new Set();
            (target.preFilled||[]).forEach(pf => {
                (pf.cells||[]).forEach(({row,col}) => preFilledSet.add(row+','+col));
            });
            (target.cells||[]).forEach(({row,col}) => {
                const cell = document.querySelector('.grid-cell[data-row="'+row+'"][data-col="'+col+'"]');
                if (!cell) return;
                if (!preFilledSet.has(row+','+col)) {
                    cell.classList.add('target-cell'); // 空白格子高亮
                }
            });
            // 渲染预填充四连方（正常颜色，无高亮边框，无单元格背景）
            (target.preFilled||[]).forEach(pf => {
                const color = SHAPE_COLORS[pf.type];
                pf.cells.forEach(({row,col}) => {
                    const cell = document.querySelector('.grid-cell[data-row="'+row+'"][data-col="'+col+'"]');
                    if (cell && !cell.hasChildNodes()) {
                        const sq = document.createElement('div');
                        sq.className = 'sq';
                        sq.style.background = color;
                        sq.dataset.preFilled = '1';
                        sq.style.opacity = '1';
                        cell.appendChild(sq);
                        cell.classList.add('filled','pre-filled-cell'); // 去掉单元格边框背景
                    }
                });
            });
        } else {
            highlightTargetCells(target.cells, (target.preFilled||[]));
            if (target.preFilled) {
                target.preFilled.forEach(pf => {
                    const color = SHAPE_COLORS[pf.type];
                    pf.cells.forEach(({row,col}) => {
                        const cell = document.querySelector('.grid-cell[data-row="' + row + '"][data-col="' + col + '"]');
                        if (cell && !cell.hasChildNodes()) {
                            const sq = document.createElement('div');
                            sq.className = 'sq';
                            sq.style.background = color;
                            sq.dataset.preFilled = '1';
                            sq.style.opacity = '0.92';
                            cell.appendChild(sq);
                            cell.classList.add('filled','pre-filled');
                        }
                    });
                });
            }
        }
    }); // end requestAnimationFrame
}

// 换一个随机长方形（应用实践-拼任意长方形专用）
function regenPracticeRect() {
    const cfg = window.__practiceCfg;
    if (!cfg || cfg.practiceType !== 'rectangle') return;
    renderPracticeMode(cfg, false);
}

// 换一个随机正方形（应用实践-拼任意正方形专用）
function regenPracticeSquare() {
    const cfg = window.__practiceCfg;
    if (!cfg || cfg.practiceType !== 'square') return;
    renderPracticeMode(cfg, false);
}

// 随机填充图形（应用实践-四连方填充图形专用）
function regenPracticeFill() {
    const cfg = window.__practiceCfg;
    if (!cfg || cfg.practiceType !== 'fill') return;
    renderPracticeMode(cfg, false);
}

// 认识四连方 - 使用帮助
function showDragSquaresHelp() {
    const helpText = `拼图区域操作指南：

1. 拖拽左侧的4个蓝色正方形到右侧网格中
2. 点击网格中已放置的正方形可以移除它
3. 尝试将4个正方形拼成不同的四连方形状
4. 四连方要求：每个正方形必须与另一个正方形共享一条完整的边

💡 提示：试试拼出一字形、L形、T形、田字形、Z形！`;
    alert(helpText);
}

// 点击遮罩层关闭弹窗
document.addEventListener('click', (e) => {
    const modal = document.getElementById('helpModal');
    if (e.target === modal) {
        closeHelp();
    }
});

// ============================================================
// 初始化：默认显示"探究新知"
// ============================================================
window.addEventListener('DOMContentLoaded', () => {
    switchTab('explore');
});
</script>

                    <li>点击"验证结果"检查答案</li>
                </ol>

            <button class="help-modal-btn" onclick="closeHelp()">确定</button>
        </div>
