<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>使用说明 - 拼图游戏——认识四连方</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Microsoft YaHei', '微软雅黑', sans-serif;
            background: linear-gradient(135deg, #e0f2fe 0%, #dbeafe 50%, #eff6ff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px;
        }

        /* 主容器 - 居中显示 */
        .main-container {
            display: flex;
            width: 100%;
            max-width: 1200px;
            min-height: 600px;
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1);
            overflow: hidden;
        }

        /* ========== 左侧竖条标题区 ========== */
        .left-sidebar {
            width: 80px;
            background: linear-gradient(180deg, #3b82f6 0%, #1e40af 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 0;
            box-shadow: 4px 0 15px rgba(0,0,0,0.1);
            position: relative;
            z-index: 10;
        }

        .sidebar-title {
            writing-mode: vertical-rl;
            text-orientation: upright;
            color: white;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 12px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            text-align: center;
        }

        /* 左侧装饰灯泡 */
        .sidebar-bulb {
            position: absolute;
            bottom: 40px;
            width: 36px;
            height: 50px;
        }

        .sidebar-bulb::before {
            content: '';
            position: absolute;
            width: 30px;
            height: 30px;
            background: radial-gradient(circle at 30% 30%, #fef3c7, #fbbf24);
            border-radius: 50%;
            top: 0;
            left: 3px;
            box-shadow: 0 0 15px rgba(251, 191, 36, 0.6);
        }

        .sidebar-bulb::after {
            content: '';
            position: absolute;
            width: 14px;
            height: 16px;
            background: linear-gradient(180deg, #9ca3af 0%, #6b7280 100%);
            bottom: 0;
            left: 11px;
            border-radius: 0 0 4px 4px;
        }

        /* ========== 中间内容区（电脑显示器效果） ========== */
        .center-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            position: relative;
            background: linear-gradient(180deg, #eff6ff 0%, #dbeafe 100%);
        }

        /* 电脑显示器外框 */
        .monitor-frame {
            width: 100%;
            max-width: 900px;
            background: linear-gradient(145deg, #374151 0%, #1f2937 100%);
            border-radius: 20px;
            padding: 20px 20px 40px;
            box-shadow: 
                0 25px 50px rgba(0,0,0,0.3),
                inset 0 2px 4px rgba(255,255,255,0.1);
            position: relative;
        }

        /* 显示器屏幕 */
        .monitor-screen {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            aspect-ratio: 16/10;
            position: relative;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.1);
        }

        /* 屏幕内容 - 显示使用说明视频 */
        .screen-content {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            background: #1a1a1a;
        }

        .screen-content video {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 4px;
        }

        /* 显示器底座 */
        .monitor-stand {
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 30px;
            background: linear-gradient(180deg, #4b5563 0%, #374151 100%);
            border-radius: 0 0 8px 8px;
        }

        .monitor-base {
            position: absolute;
            bottom: -50px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 20px;
            background: linear-gradient(180deg, #6b7280 0%, #4b5563 100%);
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        /* ========== 右侧说明区 ========== */
        .right-info {
            width: 320px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            padding: 40px 30px;
            display: flex;
            flex-direction: column;
            border-left: 1px solid rgba(255,255,255,0.5);
        }

        /* 顶部Logo区 */
        .info-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .software-logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 24px;
            background: linear-gradient(135deg, #f97316, #ea580c);
            border-radius: 25px;
            color: white;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 15px;
            box-shadow: 0 4px 12px rgba(249,115,22,0.3);
        }

        /* 说明文字 */
        .info-text {
            color: #374151;
            font-size: 15px;
            line-height: 1.8;
            margin-bottom: 30px;
            text-align: justify;
        }

        .info-text p {
            margin-bottom: 15px;
            text-indent: 2em;
        }

        /* 按钮区 */
        .info-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: auto;
        }

        .info-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 28px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
        }

        .btn-back {
            background: linear-gradient(135deg, #60a5fa, #3b82f6);
            color: white;
            box-shadow: 0 4px 12px rgba(96,165,250,0.4);
        }

        .btn-back:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(96,165,250,0.5);
        }

        /* ========== 响应式设计 ========== */
        @media (max-width: 1200px) {
            .right-info {
                width: 280px;
                padding: 30px 20px;
            }
        }

        @media (max-width: 900px) {
            body {
                padding: 16px;
            }

            .main-container {
                flex-direction: column;
            }

            .left-sidebar {
                width: 100%;
                height: 60px;
                flex-direction: row;
                padding: 0 20px;
            }

            .sidebar-title {
                writing-mode: horizontal-tb;
                text-orientation: mixed;
                letter-spacing: 4px;
                font-size: 20px;
            }

            .sidebar-bulb {
                position: static;
                margin-left: auto;
            }

            .center-content {
                padding: 20px;
            }

            .right-info {
                width: 100%;
                border-left: none;
                border-top: 1px solid rgba(255,255,255,0.5);
            }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- 左侧竖条标题 -->
        <aside class="left-sidebar">
            <div class="sidebar-title">使用说明</div>
            <div class="sidebar-bulb"></div>
        </aside>

        <!-- 中间内容区（电脑显示器） -->
        <main class="center-content">
            <div class="monitor-frame">
                <div class="monitor-screen">
                    <div class="screen-content">
                        <video src="tetromino_intro.mp4" controls loop playsinline>
                            您的浏览器不支持视频播放
                        </video>
                    </div>
                </div>
                <div class="monitor-stand"></div>
                <div class="monitor-base"></div>
            </div>
        </main>

        <!-- 右侧说明区 -->
        <aside class="right-info">
            <div class="info-header">
                <div class="software-logo">
                    <span>拼图游戏——认识四连方</span>
                </div>
            </div>

            <div class="info-text">
                <p>在《拼图游戏——认识四连方》教学软件中，设置了丰富的交互效果，以及为各位使用者准备了各种相对应的教学资源。</p>
                <p>建议各位使用者点击播放按钮观看操作演示。</p>
            </div>

            <div class="info-buttons">
                <button class="info-btn btn-back" onclick="goBack()">
                    返回首页
                </button>
            </div>
        </aside>
    </div>

    <script>
        function goBack() {
            window.location.href = 'homepage_design.html';
        }
    </script>
</body>
</html>
