<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>拼图游戏——认识四连方</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #0066cc;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .splash-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .splash-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .click-hint {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.8);
            font-size: 1.2rem;
            animation: pulse 2s infinite;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        /* 加载动画 */
        .fade-in {
            animation: fadeIn 1s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="splash-container fade-in" onclick="enterHome()">
        <img src="./start.jpg" alt="拼图游戏——认识四连方" class="splash-image">
        <div class="click-hint">点击任意位置进入 →</div>
    </div>

    <script>
        function enterHome() {
            window.location.href = 'homepage_design.html';
        }

        // 支持键盘回车键进入
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' || e.key === ' ') {
                enterHome();
            }
        });
    </script>
</body>
</html>
