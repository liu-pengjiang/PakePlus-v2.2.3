<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>四连方 - 查看资源</title>
    <style>
        /* =================== 设计令牌系统（与主界面一致）==================== */
        :root {
            /* 主色调 - 教育蓝 */
            --color-primary-50: #eff6ff;
            --color-primary-100: #dbeafe;
            --color-primary-200: #bfdbfe;
            --color-primary-300: #93c5fd;
            --color-primary-400: #60a5fa;
            --color-primary-500: #3b82f6;
            --color-primary-600: #2563eb;
            --color-primary-700: #1e40af;
            --color-primary-800: #1e40af;
            --color-primary-900: #1e3a8a;

            /* 辅助色 */
            --color-secondary-100: #f3f4f6;
            --color-secondary-200: #e5e7eb;
            --color-secondary-300: #d1d5db;
            --color-secondary-500: #6b7280;
            --color-secondary-700: #374151;
            --color-secondary-900: #111827;

            /* 功能色 */
            --color-success: #10b981;
            --color-warning: #f59e0b;
            --color-error: #ef4444;
            --color-info: #3b82f6;

            /* 字体 */
            --font-family-primary: 'Microsoft YaHei', '微软雅黑', system-ui, -apple-system, sans-serif;

            /* 字体大小 */
            --font-size-xs: 0.75rem;    /* 12px */
            --font-size-sm: 0.875rem;   /* 14px */
            --font-size-base: 1rem;     /* 16px */
            --font-size-lg: 1.125rem;   /* 18px */
            --font-size-xl: 1.25rem;    /* 20px */
            --font-size-2xl: 1.5rem;   /* 24px */
            --font-size-3xl: 1.875rem;  /* 30px */
            --font-size-4xl: 2.25rem;   /* 36px */
            --font-size-5xl: 3rem;      /* 48px */

            /* 间距 */
            --space-1: 0.25rem;   /* 4px */
            --space-2: 0.5rem;    /* 8px */
            --space-3: 0.75rem;   /* 12px */
            --space-4: 1rem;      /* 16px */
            --space-6: 1.5rem;    /* 24px */
            --space-8: 2rem;      /* 32px */
            --space-12: 3rem;     /* 48px */
            --space-16: 4rem;     /* 64px */

            /* 阴影 */
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
            --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1);

            /* 过渡 */
            --transition-fast: 150ms ease;
            --transition-normal: 300ms ease;
        }

        /* =================== 全局重置 =================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-family-primary);
            background: linear-gradient(135deg, #e0f2fe 0%, #dbeafe 50%, #eff6ff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--space-8);
        }

        /* =================== 主容器 =================== */
        .main-container {
            display: flex;
            width: 100%;
            max-width: 1400px;
            min-height: 600px;
            background: white;
            border-radius: 24px;
            box-shadow: var(--shadow-xl);
            overflow: hidden;
            position: relative;
        }

        /* =================== 左侧资源列表区 =================== */
        .left-section {
            flex: 0 0 280px;
            background: linear-gradient(180deg, var(--color-primary-500) 0%, var(--color-primary-600) 100%);
            padding: var(--space-8);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .left-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                radial-gradient(ellipse at 50% 20%, rgba(255, 255, 255, 0.1) 0%, transparent 60%);
            pointer-events: none;
        }

        /* 横排标题 */
        .horizontal-title {
            color: white;
            font-size: var(--font-size-2xl);
            font-weight: 700;
            letter-spacing: 0.1em;
            margin-bottom: var(--space-6);
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
            position: relative;
            z-index: 1;
        }

        /* 资源列表 */
        .resource-list {
            display: flex;
            flex-direction: column;
            gap: var(--space-4);
            padding: var(--space-6) 0;
            position: relative;
            z-index: 1;
        }

        .resource-item {
            padding: var(--space-4) var(--space-6);
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            color: white;
            font-size: var(--font-size-lg);
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition-normal);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .resource-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s ease;
        }

        .resource-item:hover::before {
            left: 100%;
        }

        .resource-item:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.5);
            transform: translateX(8px);
        }

        .resource-item.active {
            background: rgba(255, 255, 255, 0.3);
            color: white;
            border-color: rgba(255, 255, 255, 0.8);
            font-weight: 600;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        }

        /* 返回首页按钮（左侧资源列表中） */
        .back-item {
            background: rgba(59, 130, 246, 0.3);
            border-color: rgba(255, 255, 255, 0.4);
            font-weight: 500;
        }

        .back-item:hover {
            background: rgba(59, 130, 246, 0.5);
            border-color: rgba(255, 255, 255, 0.6);
            transform: translateX(8px);
        }

        /* 左下角装饰 - 灯泡图标 */
        .bulb-decoration {
            position: absolute;
            bottom: var(--space-8);
            left: var(--space-6);
            width: 60px;
            height: 80px;
            z-index: 1;
        }

        .bulb {
            width: 40px;
            height: 40px;
            background: radial-gradient(circle, #fef08a 0%, #facc15 70%, #eab308 100%);
            border-radius: 50%;
            margin: 0 auto;
            box-shadow: 0 0 20px rgba(254, 240, 138, 0.6);
            position: relative;
        }

        .bulb::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 16px;
            background: linear-gradient(180deg, #facc15, #eab308);
            clip-path: polygon(10% 0%, 90% 0%, 100% 100%, 0% 100%);
        }

        .bulb-base {
            width: 24px;
            height: 20px;
            background: linear-gradient(180deg, #eab308, #ca8a04);
            margin: 8px auto 0;
            border-radius: 4px;
        }

        /* =================== 中间预览区（已扩展到右边） =================== */
        .center-section {
            flex: 1;
            background: linear-gradient(180deg, #eff6ff 0%, #dbeafe 100%);
            padding: var(--space-12);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* 水彩背景纹理 */
        .center-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                radial-gradient(ellipse at 30% 30%, rgba(147, 197, 253, 0.4) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 70%, rgba(96, 165, 250, 0.3) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(191, 219, 254, 0.3) 0%, transparent 70%);
            pointer-events: none;
            filter: blur(30px);
        }

        /* 文档预览框 */
        .doc-preview {
            width: 100%;
            max-width: 900px;
            height: 600px;
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 50%, #dbeafe 100%);
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            position: relative;
            z-index: 1;
        }

        /* 预览区装饰图案 */
        .doc-preview::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                radial-gradient(circle at 20% 30%, rgba(59, 130, 246, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(96, 165, 250, 0.06) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(147, 197, 253, 0.05) 0%, transparent 60%),
                radial-gradient(circle at 30% 80%, rgba(191, 219, 254, 0.08) 0%, transparent 45%),
                radial-gradient(circle at 70% 20%, rgba(37, 99, 235, 0.05) 0%, transparent 35%);
            pointer-events: none;
        }

        /* 四连方装饰块 */
        .preview-decoration {
            position: absolute;
            pointer-events: none;
            opacity: 0.15;
        }

        .preview-block-1 {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #3b82f6, #60a5fa);
            border-radius: 8px;
            top: 15%;
            left: 10%;
            transform: rotate(12deg);
        }

        .preview-block-2 {
            width: 40px;
            height: 80px;
            background: linear-gradient(180deg, #60a5fa, #3b82f6);
            border-radius: 6px;
            top: 60%;
            right: 8%;
            transform: rotate(-8deg);
        }

        .preview-block-3 {
            width: 50px;
            height: 50px;
            background: linear-gradient(45deg, #93c5fd, #60a5fa);
            border-radius: 8px;
            bottom: 20%;
            left: 15%;
            transform: rotate(20deg);
        }

        .preview-block-4 {
            width: 35px;
            height: 70px;
            background: linear-gradient(90deg, #3b82f6, #2563eb);
            border-radius: 6px;
            top: 25%;
            right: 12%;
            transform: rotate(-15deg);
        }

        .doc-preview iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* 占位符 */
        .preview-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--color-secondary-500);
            text-align: center;
            padding: var(--space-8);
        }

        .preview-placeholder svg {
            width: 80px;
            height: 80px;
            margin-bottom: var(--space-4);
            opacity: 0.5;
        }

        .preview-placeholder p {
            font-size: var(--font-size-lg);
            font-weight: 500;
        }

        /* =================== 四连方装饰元素 =================== */
        .tetromino-decorations {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 0;
        }

        .tetromino {
            position: absolute;
            opacity: 0.1;
            border-radius: 4px;
        }

        .tetromino-1 {
            width: 40px;
            height: 40px;
            background: var(--color-primary-400);
            top: 10%;
            right: 10%;
            transform: rotate(15deg);
        }

        .tetromino-2 {
            width: 30px;
            height: 60px;
            background: var(--color-primary-500);
            bottom: 20%;
            left: 5%;
            transform: rotate(-10deg);
        }

        /* =================== 响应式设计 =================== */
        @media (max-width: 1024px) {
            .main-container {
                flex-direction: column;
                max-width: 90%;
            }

            .left-section {
                flex: none;
                padding: var(--space-6);
            }

            .horizontal-title {
                margin: var(--space-4) 0;
                font-size: var(--font-size-2xl);
            }

            .resource-list {
                flex-direction: row;
                overflow-x: auto;
            }

            .center-section {
                min-height: 500px;
            }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- 左侧资源列表区 -->
        <div class="left-section">
            <!-- 四连方装饰 -->
            <div class="tetromino-decorations">
                <div class="tetromino tetromino-1"></div>
                <div class="tetromino tetromino-2"></div>
            </div>

            <!-- 横排标题 -->
            <div class="horizontal-title">查看资源</div>

            <!-- 资源列表 -->
            <div class="resource-list">
                <div class="resource-item" onclick="selectResource(this, '教学设计')">
                    教学设计
                </div>
                <div class="resource-item" onclick="selectResource(this, '学习任务单')">
                    学习任务单
                </div>

                <!-- 返回首页按钮（放在学习单下面） -->
                <div class="resource-item back-item" onclick="goBack()">
                    返回首页
                </div>
            </div>

            <!-- 左下角装饰 - 灯泡 -->
            <div class="bulb-decoration">
                <div class="bulb"></div>
                <div class="bulb-base"></div>
            </div>
        </div>

        <!-- 中间预览区（已扩展到右边，无右侧区域） -->
        <div class="center-section">
            <!-- 水彩背景纹理 -->
            <div class="tetromino-decorations">
                <div class="tetromino tetromino-1"></div>
                <div class="tetromino tetromino-2"></div>
            </div>

            <!-- 文档预览框 -->
            <div class="doc-preview">
                <!-- 四连方装饰块 -->
                <div class="preview-decoration preview-block-1"></div>
                <div class="preview-decoration preview-block-2"></div>
                <div class="preview-decoration preview-block-3"></div>
                <div class="preview-decoration preview-block-4"></div>

                <!-- 占位符（当没有选中资源时显示） -->
                <div class="preview-placeholder" id="placeholder">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                        <polyline points="14 2 14 8 20 8"/>
                        <line x1="16" y1="13" x2="8" y2="13"/>
                        <line x1="16" y1="17" x2="8" y2="17"/>
                        <polyline points="10 9 9 9 8 9"/>
                    </svg>
                    <p id="preview-text">点击左侧资源查看预览</p>
                </div>
                <!-- 文档预览iframe（选中HTML资源后显示） -->
                <iframe id="preview-frame" src="" style="display:none;"></iframe>
                <!-- PDF预览embed（选中PDF资源后显示） -->
                <embed id="preview-pdf" src="" type="application/pdf" style="display:none; width:100%; height:100%;" />
            </div>
        </div>
    </div>

    <script>
        let currentResource = null;

        // 选择资源（按钮点击）
        function selectResource(element, resourceName) {
            // 移除所有按钮的active状态
            document.querySelectorAll('.resource-item').forEach(item => {
                item.classList.remove('active');
            });

            // 为当前点击的按钮添加active状态
            element.classList.add('active');
            currentResource = resourceName;

            // 加载文档到预览区
            loadDocument(resourceName);
        }

        // 加载文档到预览区
        function loadDocument(resourceName) {
            const iframe = document.getElementById('preview-frame');
            const embed = document.getElementById('preview-pdf');
            const placeholder = document.getElementById('placeholder');

            // 判断资源类型（教学设计和学习任务单都是PDF）
            const isPDF = (resourceName === '学习任务单' || resourceName === '教学设计');
            // PDF文件在同级目录
            const docPath = `./${resourceName}.pdf`;

            // 隐藏占位符
            placeholder.style.display = 'none';

            if (isPDF) {
                // PDF文件使用embed标签显示
                iframe.style.display = 'none';
                iframe.src = '';
                embed.style.display = 'block';
                embed.src = docPath;
            } else {
                // HTML文件使用iframe显示
                embed.style.display = 'none';
                embed.src = '';
                iframe.style.display = 'block';
                iframe.src = docPath;
            }
        }

        // 返回首页
        function goBack() {
            window.location.href = 'homepage_design.html';
        }

        // 初始加载时检查URL参数，自动加载指定资源
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const resource = urlParams.get('resource');
            if (resource) {
                const targetItem = document.querySelector(`.resource-item[onclick*="${resource}"]`);
                if (targetItem) {
                    selectResource(targetItem, resource);
                }
            }
        });
    </script>
</body>
</html>
